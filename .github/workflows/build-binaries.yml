name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: executas/cyberai-study-agent
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            binary_name: cyberai-study-agent-windows-x86_64.exe
          - os: ubuntu-latest
            arch: x86_64
            binary_name: cyberai-study-agent-linux-x86_64
          - os: macos-13
            arch: x86_64
            binary_name: cyberai-study-agent-darwin-x86_64
          - os: macos-latest
            arch: arm64
            binary_name: cyberai-study-agent-darwin-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.11

      - name: Create venv and install dependencies
        run: |
          uv venv
          if [ -f requirements.txt ]; then
            uv pip install -r requirements.txt
          fi
          uv pip install pyinstaller pypdf

      - name: Build executable
        run: |
          uv run pyinstaller --onefile --name binary cyberai_study_agent_plugin.py
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp dist/binary.exe dist/${{ matrix.binary_name }}
          else
            cp dist/binary dist/${{ matrix.binary_name }}
          fi

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: executas/cyberai-study-agent/dist/${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*