name: Build Executables

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }} (${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            binary_name: cyberai-study-agent-windows-x86_64.exe
          - os: ubuntu-latest
            arch: x86_64
            binary_name: cyberai-study-agent-linux-x86_64
          - os: macos-13
            arch: x86_64
            binary_name: cyberai-study-agent-darwin-x86_64
          - os: macos-latest
            arch: arm64
            binary_name: cyberai-study-agent-darwin-aarch64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller uv
          uv pip install --system -e . 2>nul || uv pip install --system -e . 2>/dev/null || pip install -r requirements.txt || true

      - name: Build executable with PyInstaller (Windows)
        if: runner.os == 'Windows'
        run: |
          pyinstaller --onefile --name cyberai-study-agent-windows-x86_64 cyberai_study_agent_plugin.py

      - name: Build executable with PyInstaller (Unix)
        if: runner.os != 'Windows'
        run: |
          pyinstaller --onefile --name ${{ matrix.binary_name }} cyberai_study_agent_plugin.py

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary_name }}
          path: dist/${{ matrix.binary_name }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*