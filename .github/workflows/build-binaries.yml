# Builds the self-contained PyInstaller binary of the Executa for each
# platform Anna supports and attaches the archives to a GitHub Release.
# Asset names must match executa.json -> distribution.profiles.binary.
name: Build Executables

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: windows-latest, name: windows-x86_64, python_arch: x64, pyi_arch: "", file_arch: "x86-64" }
          - { os: ubuntu-latest, name: linux-x86_64, python_arch: x64, pyi_arch: "", file_arch: "x86-64" }
          - { os: macos-14, name: darwin-arm64, python_arch: arm64, pyi_arch: arm64, file_arch: "arm64" }
          # Intel macOS runners are being retired. The python.org build on
          # macOS is universal2, so PyInstaller can cross-target x86_64 from
          # an Apple Silicon runner with --target-arch.
          - { os: macos-14, name: darwin-x86_64, python_arch: arm64, pyi_arch: x86_64, file_arch: "x86_64" }
    defaults:
      run:
        shell: bash
        working-directory: executas/cyberai-study-agent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python_arch }}

      - name: Install build dependencies
        run: python -m pip install --upgrade pip pyinstaller "pypdf>=4"

      - name: Build binary
        run: |
          ARCH_FLAG=""
          [ -n "${{ matrix.platform.pyi_arch }}" ] && ARCH_FLAG="--target-arch ${{ matrix.platform.pyi_arch }}"
          pyinstaller --onefile --clean --noupx $ARCH_FLAG --name cyberai-study-agent cyberai_study_agent_plugin.py

      - name: Check binary architecture
        if: runner.os != 'Windows'
        run: |
          BIN=dist/cyberai-study-agent
          [ "$RUNNER_OS" = "Windows" ] && BIN=dist/cyberai-study-agent.exe
          file "$BIN"
          file "$BIN" | grep -q "${{ matrix.platform.file_arch }}"

      - name: Smoke test (describe over stdio)
        continue-on-error: ${{ matrix.platform.name == 'darwin-x86_64' }}
        run: |
          BIN=dist/cyberai-study-agent
          [ "$RUNNER_OS" = "Windows" ] && BIN=dist/cyberai-study-agent.exe
          echo '{"jsonrpc":"2.0","id":1,"method":"describe"}' | "$BIN" | grep -q '"extract_pdf"'

      - name: Package
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a ../cyberai-study-agent-${{ matrix.platform.name }}.zip cyberai-study-agent.exe
          else
            tar -czf ../cyberai-study-agent-${{ matrix.platform.name }}.tar.gz cyberai-study-agent
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform.name }}
          path: |
            executas/cyberai-study-agent/cyberai-study-agent-${{ matrix.platform.name }}.zip
            executas/cyberai-study-agent/cyberai-study-agent-${{ matrix.platform.name }}.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
